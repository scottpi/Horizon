name: Daily Horizon Summary

on:
  schedule:
    # GitHub scheduled workflows use UTC, no automatic DST switch.
    # 06:00 Europe/Berlin = 04:00 UTC in summer (CEST), 05:00 UTC in winter (CET).
    # Currently set for summer time; flip to '0 5 * * *' when Germany switches to CET.
    - cron: '0 4 * * *'
  workflow_dispatch:      # Allow manual trigger

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed by the Pages deploy step to push to gh-pages

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Run Horizon
        env:
          # Must match data/config.json: ai.api_key_env
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          # Built-in token, raises the GitHub API rate limit for the repo_releases sources
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Reddit OAuth app-only auth; anonymous scraping gets 403'd more often
          # from shared runner IPs. Must match data/config.json: sources.reddit.*_env
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: uv run horizon --hours 24

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
